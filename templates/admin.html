<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 高考择校助手</title>
    <style>
        :root { --green: #2ED573; --green-hover: #27AE60; --bg: #F8F9FA; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: #1A1A1A; }
        .container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 24px; margin-bottom: 8px; }
        .subtitle { color: #999; font-size: 14px; margin-bottom: 30px; }
        .card { background: white; border: 1px solid #E8E8E8; border-radius: 14px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .card h2 { font-size: 16px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid var(--green); }
        label { font-size: 13px; font-weight: 600; color: #555; display: block; margin-bottom: 6px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px 14px; border: 2px solid #E8E8E8; border-radius: 10px; font-size: 14px; margin-bottom: 12px; }
        input:focus { outline: none; border-color: var(--green); }
        .btn { background: var(--green); color: white; border: none; padding: 12px 28px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn:hover { background: var(--green-hover); }
        .btn-danger { background: #FF6B6B; }
        .btn-danger:hover { background: #E8414F; }
        .status-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #F0F0F0; font-size: 14px; }
        .status-row:last-child { border: none; }
        .status-ok { color: var(--green); font-weight: bold; }
        .status-err { color: #FF6B6B; font-weight: bold; }
        .msg { padding: 12px; border-radius: 8px; font-size: 13px; margin-top: 12px; display: none; }
        .msg.ok { background: #EAFAF1; color: #27AE60; }
        .msg.err { background: #FFF5F5; color: #FF6B6B; }
        .login-box { text-align: center; margin-top: 80px; }
        .login-box h2 { margin-bottom: 20px; }
        .login-box .btn { max-width: 300px; margin: 0 auto; }
        .nav-link { display: inline-block; color: var(--green); text-decoration: none; font-size: 14px; margin-bottom: 20px; }
        .nav-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container" id="loginView">
        <div class="login-box">
            <h1>管理员登录</h1>
            <p class="subtitle">高考择校助手管理后台</p>
            <div class="card">
                <label>管理员密码</label>
                <input type="password" id="adminPwd" placeholder="请输入管理员密码">
                <button class="btn" onclick="doLogin()">登录</button>
                <div class="msg" id="loginMsg"></div>
            </div>
        </div>
    </div>

    <div class="container" id="adminView" style="display:none">
        <a href="/" class="nav-link">← 返回首页</a>
        <h1>管理后台</h1>
        <p class="subtitle">高考择校助手 · 系统管理</p>

        <!-- 系统状态 -->
        <div class="card">
            <h2>系统状态</h2>
            <div id="sysStatus">
                <div class="status-row"><span>AI 功能</span><span id="aiStatus">检查中...</span></div>
                <div class="status-row"><span>API Key</span><span id="keyStatus">检查中...</span></div>
                <div class="status-row"><span>大学数据</span><span id="dataStatus">检查中...</span></div>
                <div class="status-row"><span>缓存数量</span><span id="cacheStatus">检查中...</span></div>
            </div>
        </div>

        <!-- API Key 配置 -->
        <div class="card">
            <h2>API Key 配置</h2>
            <label>Claude API Key</label>
            <input type="text" id="apiKeyInput" placeholder="sk-ant-...">
            <button class="btn" onclick="saveKey()">保存 API Key</button>
            <div class="msg" id="keyMsg"></div>
        </div>

        <!-- 管理员密码 -->
        <div class="card">
            <h2>修改管理员密码</h2>
            <label>新密码</label>
            <input type="password" id="newPwd" placeholder="输入新密码">
            <button class="btn" onclick="changePwd()">修改密码</button>
            <div class="msg" id="pwdMsg"></div>
        </div>
    </div>

    <script>
        let token = '';

        function showMsg(id, text, ok) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.className = 'msg ' + (ok ? 'ok' : 'err');
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        async function doLogin() {
            const pwd = document.getElementById('adminPwd').value;
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password: pwd})
                });
                const data = await res.json();
                if (data.success) {
                    token = data.token;
                    document.getElementById('loginView').style.display = 'none';
                    document.getElementById('adminView').style.display = 'block';
                    loadStatus();
                } else {
                    showMsg('loginMsg', '密码错误', false);
                }
            } catch(e) {
                showMsg('loginMsg', '登录失败: ' + e.message, false);
            }
        }

        async function loadStatus() {
            try {
                const res = await fetch('/api/admin/status', {
                    headers: {'Authorization': 'Bearer ' + token}
                });
                const data = await res.json();
                document.getElementById('aiStatus').textContent = data.ai_ready ? '正常' : '未配置';
                document.getElementById('aiStatus').className = data.ai_ready ? 'status-ok' : 'status-err';
                document.getElementById('keyStatus').textContent = data.has_key ? '已配置' : '未配置';
                document.getElementById('keyStatus').className = data.has_key ? 'status-ok' : 'status-err';
                document.getElementById('dataStatus').textContent = data.university_count + ' 所大学';
                document.getElementById('dataStatus').className = 'status-ok';
                document.getElementById('cacheStatus').textContent = data.cache_count + ' 条';
            } catch(e) {
                console.error(e);
            }
        }

        async function saveKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key) return;
            try {
                const res = await fetch('/api/admin/api-key', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
                    body: JSON.stringify({api_key: key})
                });
                const data = await res.json();
                if (data.success) {
                    showMsg('keyMsg', '保存成功，AI 功能已启用', true);
                    document.getElementById('apiKeyInput').value = '';
                    loadStatus();
                } else {
                    showMsg('keyMsg', '保存失败', false);
                }
            } catch(e) {
                showMsg('keyMsg', '保存失败: ' + e.message, false);
            }
        }

        async function changePwd() {
            const newPwd = document.getElementById('newPwd').value.trim();
            if (!newPwd || newPwd.length < 4) {
                showMsg('pwdMsg', '密码至少4位', false);
                return;
            }
            try {
                const res = await fetch('/api/admin/password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
                    body: JSON.stringify({password: newPwd})
                });
                const data = await res.json();
                if (data.success) {
                    showMsg('pwdMsg', '密码修改成功', true);
                    document.getElementById('newPwd').value = '';
                }
            } catch(e) {
                showMsg('pwdMsg', '修改失败: ' + e.message, false);
            }
        }

        // Enter 键登录
        document.getElementById('adminPwd').addEventListener('keypress', e => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
