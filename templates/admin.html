<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 先看看</title>
    <style>
        :root { --green: #2ED573; --green-hover: #27AE60; --bg: #F8F9FA; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: #1A1A1A; }
        .container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 24px; margin-bottom: 8px; }
        .subtitle { color: #999; font-size: 14px; margin-bottom: 30px; }
        .card { background: white; border: 1px solid #E8E8E8; border-radius: 14px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .card h2 { font-size: 16px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid var(--green); }
        label { font-size: 13px; font-weight: 600; color: #555; display: block; margin-bottom: 6px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px 14px; border: 2px solid #E8E8E8; border-radius: 10px; font-size: 14px; margin-bottom: 12px; }
        input:focus { outline: none; border-color: var(--green); }
        .btn { background: var(--green); color: white; border: none; padding: 12px 28px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn:hover { background: var(--green-hover); }
        .btn-danger { background: #FF6B6B; }
        .btn-danger:hover { background: #E8414F; }
        .status-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #F0F0F0; font-size: 14px; }
        .status-row:last-child { border: none; }
        .status-ok { color: var(--green); font-weight: bold; }
        .status-err { color: #FF6B6B; font-weight: bold; }
        .msg { padding: 12px; border-radius: 8px; font-size: 13px; margin-top: 12px; display: none; }
        .msg.ok { background: #EAFAF1; color: #27AE60; }
        .msg.err { background: #FFF5F5; color: #FF6B6B; }
        .login-box { text-align: center; margin-top: 80px; }
        .login-box h2 { margin-bottom: 20px; }
        .login-box .btn { max-width: 300px; margin: 0 auto; }
        .nav-link { display: inline-block; color: var(--green); text-decoration: none; font-size: 14px; margin-bottom: 20px; }
        .nav-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container" id="loginView">
        <div class="login-box">
            <h1>管理员登录</h1>
            <p class="subtitle">高考择校助手管理后台</p>
            <div class="card">
                <label>管理员密码</label>
                <input type="password" id="adminPwd" placeholder="请输入管理员密码">
                <button class="btn" onclick="doLogin()">登录</button>
                <div class="msg" id="loginMsg"></div>
            </div>
        </div>
    </div>

    <div class="container" id="adminView" style="display:none">
        <a href="/" class="nav-link">← 返回首页</a>
        <h1>管理后台</h1>
        <p class="subtitle">先看看 · 系统管理</p>

        <!-- 系统状态 -->
        <div class="card">
            <h2>系统状态</h2>
            <div id="sysStatus">
                <div class="status-row"><span>AI 功能</span><span id="aiStatus">检查中...</span></div>
                <div class="status-row"><span>API Key</span><span id="keyStatus">检查中...</span></div>
                <div class="status-row"><span>大学数据</span><span id="dataStatus">检查中...</span></div>
                <div class="status-row"><span>缓存数量</span><span id="cacheStatus">检查中...</span></div>
            </div>
        </div>

        <!-- API Key 配置 -->
        <div class="card">
            <h2>API Key 配置</h2>
            <label>MIMO API URL</label>
            <input type="text" id="apiUrlInput" placeholder="https://api.xiaomimimo.com/v1/chat/completions">
            <label>MIMO API Key</label>
            <input type="text" id="apiKeyInput" placeholder="输入你的 MIMO API Key">
            <button class="btn" onclick="saveKey()">保存 API Key</button>
            <div class="msg" id="keyMsg"></div>
        </div>

        <!-- 数据统计 -->
        <div class="card">
            <h2>数据统计</h2>
            <div id="dataStats"></div>
        </div>

        <!-- 宿舍数据管理 -->
        <div class="card">
            <h2>添加宿舍信息</h2>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                <div><label>大学名称</label><input type="text" id="dormUni" placeholder="如：北京大学"></div>
                <div><label>校区</label><input type="text" id="dormCampus" placeholder="如：燕园校区"></div>
                <div><label>房型</label><input type="text" id="dormType" placeholder="如：四人间"></div>
                <div><label>床位数</label><input type="number" id="dormBed" placeholder="4"></div>
                <div><label>费用/年</label><input type="text" id="dormCost" placeholder="如：1200元"></div>
                <div><label>面积</label><input type="text" id="dormArea" placeholder="如：30㎡"></div>
            </div>
            <div style="display:flex;gap:16px;margin-top:12px;flex-wrap:wrap">
                <label><input type="checkbox" id="dormAC"> 空调</label>
                <label><input type="checkbox" id="dormBath"> 独立卫浴</label>
                <label><input type="checkbox" id="dormBalcony"> 阳台</label>
                <label><input type="checkbox" id="dormHot"> 热水</label>
            </div>
            <div style="margin-top:12px">
                <label>配套设施</label><input type="text" id="dormFacilities" placeholder="如：洗衣机、饮水机、衣柜">
            </div>
            <div style="margin-top:12px">
                <label>备注</label><input type="text" id="dormNote" placeholder="其他说明">
            </div>
            <button class="btn" onclick="addDorm()" style="margin-top:12px">添加宿舍信息</button>
            <div class="msg" id="dormMsg"></div>
        </div>

        <!-- 交通数据管理 -->
        <div class="card">
            <h2>添加交通信息</h2>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                <div><label>大学名称</label><input type="text" id="transUni" placeholder="如：北京大学"></div>
                <div><label>校区</label><input type="text" id="transCampus" placeholder="如：燕园校区"></div>
                <div><label>位置类型</label><input type="text" id="transType" placeholder="如：市区/郊区"></div>
                <div><label>最近地铁站</label><input type="text" id="transMetro" placeholder="如：北京大学东门站"></div>
                <div><label>地铁距离</label><input type="text" id="transMetroDist" placeholder="如：步行5分钟"></div>
                <div><label>最近公交站</label><input type="text" id="transBus" placeholder="如：北京大学站"></div>
                <div><label>公交距离</label><input type="text" id="transBusDist" placeholder="如：步行3分钟"></div>
                <div><label>到市中心</label><input type="text" id="transCenter" placeholder="如：地铁30分钟"></div>
                <div><label>到火车站</label><input type="text" id="transStation" placeholder="如：地铁40分钟"></div>
                <div><label>到机场</label><input type="text" id="transAirport" placeholder="如：打车1小时"></div>
            </div>
            <div style="margin-top:12px">
                <label>周边商业</label><input type="text" id="transMalls" placeholder="如：中关村、五道口购物中心">
            </div>
            <div style="margin-top:12px">
                <label>周边医疗</label><input type="text" id="transHospital" placeholder="如：北医三院">
            </div>
            <div style="margin-top:12px">
                <label>备注</label><input type="text" id="transNote" placeholder="其他说明">
            </div>
            <button class="btn" onclick="addTrans()" style="margin-top:12px">添加交通信息</button>
            <div class="msg" id="transMsg"></div>
        </div>

        <!-- 管理员密码 -->
        <div class="card">
            <h2>修改管理员密码</h2>
            <label>新密码</label>
            <input type="password" id="newPwd" placeholder="输入新密码">
            <button class="btn" onclick="changePwd()">修改密码</button>
            <div class="msg" id="pwdMsg"></div>
        </div>
    </div>

    <script>
        let token = '';

        function showMsg(id, text, ok) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.className = 'msg ' + (ok ? 'ok' : 'err');
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        async function doLogin() {
            const pwd = document.getElementById('adminPwd').value;
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password: pwd})
                });
                const data = await res.json();
                if (data.success) {
                    token = data.token;
                    document.getElementById('loginView').style.display = 'none';
                    document.getElementById('adminView').style.display = 'block';
                    loadStatus();
                } else {
                    showMsg('loginMsg', '密码错误', false);
                }
            } catch(e) {
                showMsg('loginMsg', '登录失败: ' + e.message, false);
            }
        }

        async function loadStatus() {
            try {
                const res = await fetch('/api/admin/status', {
                    headers: {'Authorization': 'Bearer ' + token}
                });
                const data = await res.json();
                document.getElementById('aiStatus').textContent = data.ai_ready ? '正常' : '未配置';
                document.getElementById('aiStatus').className = data.ai_ready ? 'status-ok' : 'status-err';
                document.getElementById('keyStatus').textContent = data.has_key ? '已配置' : '未配置';
                document.getElementById('keyStatus').className = data.has_key ? 'status-ok' : 'status-err';
                document.getElementById('dataStatus').textContent = data.university_count + ' 所大学';
                document.getElementById('dataStatus').className = 'status-ok';
                document.getElementById('cacheStatus').textContent = data.cache_count + ' 条';
            } catch(e) {
                console.error(e);
            }
        }

        async function saveKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            const url = document.getElementById('apiUrlInput').value.trim();
            if (!key) return;
            try {
                const res = await fetch('/api/admin/api-key', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
                    body: JSON.stringify({api_key: key, base_url: url || null})
                });
                const text = await res.text();
                try {
                    const data = JSON.parse(text);
                    if (data.success) {
                        showMsg('keyMsg', '保存成功，AI 功能已启用', true);
                        document.getElementById('apiKeyInput').value = '';
                        loadStatus();
                    } else {
                        showMsg('keyMsg', '保存失败: ' + (data.detail || '未知错误'), false);
                    }
                } catch(parseErr) {
                    showMsg('keyMsg', '服务器返回异常: ' + text.substring(0, 100), false);
                }
            } catch(e) {
                showMsg('keyMsg', '网络错误: ' + e.message, false);
            }
        }

        async function changePwd() {
            const newPwd = document.getElementById('newPwd').value.trim();
            if (!newPwd || newPwd.length < 4) {
                showMsg('pwdMsg', '密码至少4位', false);
                return;
            }
            try {
                const res = await fetch('/api/admin/password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
                    body: JSON.stringify({password: newPwd})
                });
                const data = await res.json();
                if (data.success) {
                    showMsg('pwdMsg', '密码修改成功', true);
                    document.getElementById('newPwd').value = '';
                }
            } catch(e) {
                showMsg('pwdMsg', '修改失败: ' + e.message, false);
            }
        }

        // Enter 键登录
        document.getElementById('adminPwd').addEventListener('keypress', e => {
            if (e.key === 'Enter') doLogin();
        });

        async function loadStats() {
            try {
                const res = await fetch('/api/admin/stats', {
                    headers: {'Authorization': 'Bearer ' + token}
                });
                const data = await res.json();
                document.getElementById('dataStats').innerHTML = `
                    <div class="status-row"><span>大学数据</span><span class="status-ok">${data.university_count} 所</span></div>
                    <div class="status-row"><span>宿舍信息</span><span>${data.dormitory_count} 条（${data.dormitory_universities} 所大学）</span></div>
                    <div class="status-row"><span>交通信息</span><span>${data.transport_count} 条（${data.transport_universities} 所大学）</span></div>
                    <div class="status-row"><span>AI 功能</span><span class="${data.ai_ready ? 'status-ok' : 'status-err'}">${data.ai_ready ? '正常' : '未配置'}</span></div>
                `;
            } catch(e) { console.error(e); }
        }

        async function addDorm() {
            const data = {
                university: document.getElementById('dormUni').value.trim(),
                campus: document.getElementById('dormCampus').value.trim(),
                room_type: document.getElementById('dormType').value.trim(),
                bed_count: parseInt(document.getElementById('dormBed').value) || 0,
                cost_per_year: document.getElementById('dormCost').value.trim(),
                area: document.getElementById('dormArea').value.trim(),
                has_ac: document.getElementById('dormAC').checked ? 1 : 0,
                has_bathroom: document.getElementById('dormBath').checked ? 1 : 0,
                has_balcony: document.getElementById('dormBalcony').checked ? 1 : 0,
                has_hotwater: document.getElementById('dormHot').checked ? 1 : 0,
                facilities: document.getElementById('dormFacilities').value.trim(),
                note: document.getElementById('dormNote').value.trim(),
            };
            if (!data.university) { showMsg('dormMsg', '请填写大学名称', false); return; }
            try {
                const res = await fetch('/api/admin/dormitory', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.success) {
                    showMsg('dormMsg', '添加成功！', true);
                    ['dormCampus','dormType','dormBed','dormCost','dormArea','dormFacilities','dormNote'].forEach(id => document.getElementById(id).value = '');
                    ['dormAC','dormBath','dormBalcony','dormHot'].forEach(id => document.getElementById(id).checked = false);
                    loadStats();
                }
            } catch(e) { showMsg('dormMsg', '添加失败: ' + e.message, false); }
        }

        async function addTrans() {
            const data = {
                university: document.getElementById('transUni').value.trim(),
                campus: document.getElementById('transCampus').value.trim(),
                location_type: document.getElementById('transType').value.trim(),
                nearest_metro: document.getElementById('transMetro').value.trim(),
                metro_distance: document.getElementById('transMetroDist').value.trim(),
                nearest_bus: document.getElementById('transBus').value.trim(),
                bus_distance: document.getElementById('transBusDist').value.trim(),
                to_center: document.getElementById('transCenter').value.trim(),
                to_station: document.getElementById('transStation').value.trim(),
                to_airport: document.getElementById('transAirport').value.trim(),
                nearby_malls: document.getElementById('transMalls').value.trim(),
                nearby_hospital: document.getElementById('transHospital').value.trim(),
                note: document.getElementById('transNote').value.trim(),
            };
            if (!data.university) { showMsg('transMsg', '请填写大学名称', false); return; }
            try {
                const res = await fetch('/api/admin/transport', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.success) {
                    showMsg('transMsg', '添加成功！', true);
                    ['transCampus','transType','transMetro','transMetroDist','transBus','transBusDist','transCenter','transStation','transAirport','transMalls','transHospital','transNote'].forEach(id => document.getElementById(id).value = '');
                    loadStats();
                }
            } catch(e) { showMsg('transMsg', '添加失败: ' + e.message, false); }
        }

        // 登录后加载统计
        const origLoadStatus = loadStatus;
        loadStatus = async function() {
            await origLoadStatus();
            await loadStats();
        };
    </script>
</body>
</html>
