<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>先看看 - 高考择校助手</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">先看看</div>
        <div class="nav-tabs">
            <a href="#/look" class="nav-tab active" data-page="look">提前看学校</a>
            <a href="#/bargain" class="nav-tab" data-page="bargain">试试捡个漏</a>
        </div>
    </nav>

    <main class="container">
        <!-- 提前看学校 -->
        <section id="page-look" class="page active">
            <div class="page-header">
                <h1>提前看学校</h1>
                <p class="subtitle">搜索你感兴趣的大学，AI 帮你了解真实的校园生活</p>
            </div>

            <div class="input-card">
                <div class="search-row">
                    <input type="text" id="searchName" placeholder="输入大学名称搜索..." class="search-input">
                    <div class="filter-group">
                        <select id="searchProvince">
                            <option value="">全部省份</option>
                        </select>
                        <select id="searchType">
                            <option value="">全部类型</option>
                        </select>
                    </div>
                    <button class="btn-primary" id="btnSearch">搜索</button>
                </div>
            </div>

            <div id="searchResults" class="results-container">
                <p class="result-count" id="resultCount"></p>
                <div id="universityList" class="university-list"></div>
            </div>
        </section>

        <!-- 试试捡个漏 -->
        <section id="page-bargain" class="page">
            <div class="page-header">
                <h1>试试捡个漏</h1>
                <p class="subtitle">输入你的分数，AI 从历年数据中帮你找出有"捡漏"机会的学校</p>
            </div>

            <div class="input-card">
                <div class="input-row">
                    <div class="input-group">
                        <label>省份</label>
                        <select id="bargainProvince"></select>
                    </div>
                    <div class="input-group">
                        <label>科类</label>
                        <select id="bargainSubject"></select>
                    </div>
                    <div class="input-group">
                        <label>分数</label>
                        <input type="number" id="bargainScore" value="500" min="0" max="750">
                    </div>
                    <button class="btn-primary" id="btnBargain">帮我捡漏</button>
                </div>
            </div>

            <div id="bargainResults" class="results-container"></div>
        </section>
    </main>

    <!-- 大学详情弹窗 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal">
            <div class="modal-header">
                <div>
                    <h2 id="modalName"></h2>
                    <p id="modalInfo"></p>
                </div>
                <div class="modal-actions">
                    <button class="btn-close" id="btnClose">&times;</button>
                </div>
            </div>

            <div class="modal-body">
                <!-- 校园生活 AI -->
                <div class="section-card">
                    <h3>校园生活 · AI 智能分析</h3>
                    <div id="campusInfo" class="ai-content">
                        <div class="loading-spinner" id="campusLoading">
                            <div class="spinner"></div>
                            <span>正在分析校园生活信息...</span>
                        </div>
                        <div id="campusText" class="ai-text" style="display:none"></div>
                    </div>
                </div>

                <!-- 录取数据 -->
                <div class="section-card">
                    <h3>录取数据</h3>
                    <div id="scoreTable"></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>先看看 · 帮你提前了解大学真实生活 · 推荐结果仅供参考</p>
    </footer>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/look.js"></script>
    <script src="/static/js/bargain.js"></script>
    <script src="/static/js/detail.js"></script>
</body>
</html>
